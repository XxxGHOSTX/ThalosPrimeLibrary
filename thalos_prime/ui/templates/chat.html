<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thalos Prime chat-first interface">
    <title>Thalos Prime Chat</title>
    <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
    <main class="chat-shell">
        <header class="chat-header">
            <div>
                <h1>THALOS PRIME CHAT</h1>
                <p>Deterministic chat over Library of Babel retrieval</p>
            </div>
            <div class="session-meta">
                <span>Session:</span>
                <code id="session-id">--</code>
            </div>
        </header>

        <section class="chat-controls">
            <label>Mode
                <select id="mode">
                    <option value="generative" selected>generative</option>
                    <option value="hybrid">hybrid</option>
                    <option value="local">local</option>
                    <option value="remote">remote</option>
                </select>
            </label>
            <label>Min coherence
                <input id="min-score" type="number" min="0" max="100" step="0.1" value="80">
            </label>
            <label>Max results
                <input id="max-results" type="number" min="1" max="20" step="1" value="5">
            </label>
            <a class="secondary-link" href="/">Open full workspace</a>
        </section>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="chat-form" class="chat-form">
            <textarea id="message-input" rows="2" placeholder="Ask Thalos Prime..." required></textarea>
            <div class="chat-actions">
                <button id="clear-local" type="button">Clear view</button>
                <button id="send-message" type="submit">Send</button>
            </div>
        </form>
    </main>

    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/chat-page.js"></script>
</body>
</html>
