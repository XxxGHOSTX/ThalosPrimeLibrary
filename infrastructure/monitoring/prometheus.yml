global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "thalos-core"
    static_configs:
      - targets: ["thalos-core:8000"]
    metrics_path: /metrics

  - job_name: "sentinel-discovery"
    static_configs:
      - targets: ["sentinel-discovery:8001"]
    metrics_path: /metrics
