[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thalos-prime-library"
version = "0.1.0"
description = "The brain - ThalosPrime Library with local library import support"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ThalosPrime"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "sympy>=1.12",
    "z3-solver>=4.12.0",
    "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thalos_prime*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
thalos_prime = ["*.txt", "*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "ANN101", "ANN102", "D203", "D213",
    # Docstring punctuation - stylistic, not functional
    "D400", "D415",
    # Docstring mood - stylistic
    "D401",
    # Docstring blank line between summary and description - stylistic
    "D205",
    # Missing docstring in public package - empty __init__ files
    "D104",
    # Missing docstring in public nested class - Pydantic Config pattern
    "D106",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=thalos_prime --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = [
    "B101",   # Skip assert_used test
    "B104",   # Skip hardcoded_bind_all_interfaces - intentional for API server
    "B404",   # Skip blacklist_import_subprocess - used in controlled sandbox
    "B603",   # Skip subprocess_without_shell_equals_true - controlled sandbox
]

[[tool.mypy.overrides]]
module = [
    "sympy",
    "sympy.*",
    "networkx",
    "networkx.*",
    "z3",
    "rdflib",
    "rdflib.*",
    "bs4",
    "bs4.*",
    "requests",
    "requests.*",
    "aiohttp",
    "aiohttp.*",
    "libcst",
    "libcst.*",
    "psutil",
    "psutil.*",
]
ignore_missing_imports = true

# Legacy src/ directory - not part of thalos_prime package, no strict typing
[[tool.mypy.overrides]]
module = [
    "src",
    "src.*",
]
ignore_errors = true

# Optional FastAPI/SQLAlchemy/Pydantic modules - decorators/subclassing
# are untyped because those packages use Any when imports are missing
[[tool.mypy.overrides]]
module = [
    "thalos_prime.api",
    "thalos_prime.api.*",
    "thalos_prime.models",
    "thalos_prime.models.*",
    "thalos_prime.database",
    "thalos_prime.database.*",
]
disable_error_code = ["misc", "untyped-decorator"]

# Test files that call legacy src/ untyped functions
[[tool.mypy.overrides]]
module = [
    "tests.test_lob_shard_manager",
    "tests.test_lob_babel_search",
    "tests.test_api_chat",
    "tests.test_api_search",
    "tests.test_main",
]
disable_error_code = ["no-untyped-call"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "PLR2004", "D100", "D101", "D102", "D103", "D104",
    "ANN201", "ANN001", "ANN002", "ANN003",
    # unittest-style assertions - legacy test style
    "PT009",
    # imports not at top-level (some test setup requires this)
    "PLC0415", "E402",
    # private member access is legitimate in unit tests
    "SLF001",
]
# Optional API module - FastAPI/Pydantic/SQLAlchemy patterns
"thalos_prime/api/**/*.py" = [
    "PLC0415", "PLR2004", "BLE001", "B904", "G004", "E501",
    "ARG001", "ARG002", "TRY003", "EM101", "TRY401", "TRY300",
    "TRY301", "ASYNC240", "ASYNC230", "S104", "RUF012", "D102",
    "FBT001", "FBT002", "PTH118", "PTH120", "PTH110", "PTH123",
    "PLW0603", "PLW0602", "FAST001", "A001", "S101", "SLF001",
]
"thalos_prime/models/**/*.py" = [
    "RUF012", "D102", "BLE001", "B904", "PLC0415", "PLR2004",
    "FBT001", "FBT002", "TRY003", "EM101", "E501",
]
"thalos_prime/database/**/*.py" = [
    "RUF012", "BLE001", "B904", "PLC0415", "PLR2004", "E501",
    "G004", "ARG001", "TRY401", "PLW0603", "PLW0602",
]
"thalos_prime/__init__.py" = ["E402", "PTH110"]
"thalos_prime/lob_decoder.py" = ["PLR2004", "FBT001", "FBT002", "ARG002"]
"thalos_prime/lob_babel_generator.py" = ["PLC0415", "SLF001"]
"thalos_prime/lob_babel_enumerator.py" = ["PLR2004", "PLW2901"]
