[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thalos-prime-library"
version = "0.1.0"
description = "The brain - ThalosPrime Library with local library import support"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ThalosPrime"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
    "flask>=3.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.13.3",
    "sympy>=1.12",
    "networkx>=3.2.0",
    "z3-solver>=4.12.0",
    "rdflib>=7.0.0",
    "beautifulsoup4>=4.12.0",
    "libcst>=1.1.0",
    "jsonschema>=4.21.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "PyYAML>=6.0.0",
    "cryptography>=42.0.0",
    "deepdiff>=6.7.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
]

[project.scripts]
thalos = "thalos_prime.infra_synthesis.cli.main:main"
thalos-desktop = "thalos_prime.desktop_launcher:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "sympy>=1.12",
    "z3-solver>=4.12.0",
    "networkx>=3.0",
    "hypothesis>=6.100.0",
    "mutmut>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thalos_prime*", "thalos_nexus*", "thalos_runtime*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
thalos_prime = ["*.txt", "*.md"]
thalos_nexus = ["schemas/*.json"]
schemas = ["*.yaml", "*.json"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "uvicorn",
    "uvicorn.*",
    "jsonschema",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportPrivateUsage = false
reportUntypedBaseClass = false
reportUntypedFunctionDecorator = false
ignore = [
    "thalos_prime/api",
    "thalos_prime/models",
    "thalos_prime/database",
    "thalos_prime/auth",
    "thalos_prime/library_of_sense/reasoning",
    "thalos_prime/library_of_sense/retrieval",
    "thalos_prime/agency",
    "thalos_prime/knowledge_engine/api",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "ANN101", "ANN102", "D203", "D213",
    # Docstring punctuation - stylistic, not functional
    "D400", "D415",
    # Docstring mood - stylistic
    "D401",
    # Docstring blank line between summary and description - stylistic
    "D205",
    # Missing docstring in public package - empty __init__ files
    "D104",
    # Missing docstring in public nested class - Pydantic Config pattern
    "D106",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=thalos_prime --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = [
    "B101",   # Skip assert_used test
    "B104",   # Skip hardcoded_bind_all_interfaces - intentional for API server
    "B404",   # Skip blacklist_import_subprocess - used in controlled sandbox
    "B603",   # Skip subprocess_without_shell_equals_true - controlled sandbox
]

[[tool.mypy.overrides]]
module = [
    "sympy",
    "sympy.*",
    "networkx",
    "networkx.*",
    "z3",
    "rdflib",
    "rdflib.*",
    "bs4",
    "bs4.*",
    "requests",
    "requests.*",
    "aiohttp",
    "aiohttp.*",
    "libcst",
    "libcst.*",
    "psutil",
    "psutil.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "yaml.*",
    "deepdiff",
    "deepdiff.*",
    "cryptography",
    "cryptography.*",
]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = [
    "src",
    "src.*",
]
ignore_errors = true

# Optional FastAPI/SQLAlchemy/Pydantic modules - decorators/subclassing
# are untyped because those packages use Any when imports are missing
[[tool.mypy.overrides]]
module = [
    "thalos_prime.api",
    "thalos_prime.api.*",
    "thalos_prime.models",
    "thalos_prime.models.*",
    "thalos_prime.database",
    "thalos_prime.database.*",
]
disable_error_code = ["misc", "untyped-decorator"]

# Test files that call legacy src/ untyped functions
[[tool.mypy.overrides]]
module = [
    "tests.test_lob_shard_manager",
    "tests.test_lob_babel_search",
    "tests.test_api_chat",
    "tests.test_api_search",
    "tests.test_main",
]
disable_error_code = ["no-untyped-call"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "PLR2004", "D100", "D101", "D102", "D103", "D104",
    "ANN201", "ANN001", "ANN002", "ANN003", "ANN401",
    # unittest-style assertions - legacy test style
    "PT009",
    # imports not at top-level (some test setup requires this)
    "PLC0415", "E402",
    # private member access is legitimate in unit tests
    "SLF001",
    # docstring capitalization in subcommand descriptions
    "D403",
    # match parameter in raises - test clarity takes priority
    "PT011",
    # 0.0.0.0 bind address in test assertions for serve subcommand
    "S104",
    # long lines in test data literals - clarity takes priority
    "E501",
    # /tmp paths in test assertions - test environment
    "S108",
    # unused fixture arguments are common in test parameterization
    "ARG002",
    # nested with statements in pytest.raises patterns
    "SIM117",
    # inline exception messages in tests for clarity
    "TRY003", "EM101",
    # type-only imports: tests use annotations with runtime imports
    "TC001", "TC003",
]
# Optional API module - FastAPI/Pydantic/SQLAlchemy patterns
"thalos_prime/api/**/*.py" = [
    "PLC0415", "PLR2004", "PLR0913", "BLE001", "B904", "G004", "E501",
    "ARG001", "ARG002", "TRY003", "EM101", "TRY401", "TRY300",
    "TRY301", "ASYNC240", "ASYNC230", "S104", "RUF012", "D102",
    "FBT001", "FBT002", "PTH118", "PTH120", "PTH110", "PTH123", "PTH103",
    "PLW0603", "PLW0602", "FAST001", "A001", "S101", "SLF001",
    "D106", "D205",
]
"thalos_prime/models/**/*.py" = [
    "RUF012", "D102", "BLE001", "B904", "PLC0415", "PLR2004",
    "FBT001", "FBT002", "TRY003", "EM101", "E501", "D106",
]
"thalos_prime/database/**/*.py" = [
    "RUF012", "BLE001", "B904", "PLC0415", "PLR2004", "E501",
    "G004", "ARG001", "TRY401", "PLW0603", "PLW0602", "D104",
]
# Auth module: N818 (DeterministicHalt name required by interface contract),
# PLC0415 (fastapi optional import inside dependency factory)
"thalos_prime/auth/api_key.py" = ["N818", "PLC0415"]
"thalos_prime/auth/__init__.py" = ["D104", "RUF022"]
"thalos_prime/cache/__init__.py" = ["D104"]
# CLI module: PLC0415 (lazy imports for optional/heavy dependencies in handlers),
# S104 (--host 0.0.0.0 is user-supplied value, not hardcoded bind),
# PTH123 (open() used for simple text file writes without Path context)
"thalos_prime/cli/commands.py" = ["PLC0415", "S104", "PTH123", "TRY400"]
"thalos_prime/cli/__init__.py" = ["D104"]
"thalos_prime/planning/mcts_planner.py" = ["PLR0913"]
"thalos_prime/knowledge_graph/__init__.py" = ["D104"]
"thalos_prime/constraints/__init__.py" = ["D104"]
"thalos_prime/reasoning/__init__.py" = ["D104"]
"thalos_prime/reasoning/engine.py" = [
    "TC001", "TC003",
    "EM101", "EM102", "TRY003",
    "PLR0913",
]
"thalos_prime/graph_rag/__init__.py" = ["D104"]
"thalos_prime/graph_rag/simple_graph.py" = [
    "TC001", "TC003",
    "SLF001",
]
"thalos_prime/graph_rag/retriever.py" = [
    "TC001", "TC003",
    "PLR0913",
    "PLR2004",
]
"thalos_prime/__init__.py" = ["E402", "PTH110", "ERA001", "RUF022"]
"thalos_prime/agency/agent_loop.py" = ["TC001"]
"thalos_nexus/cli.py" = ["T201"]
"thalos_nexus/gates.py" = ["S603", "S607"]
"thalos_prime/config.py" = ["D205", "D401"]
"thalos_prime/lob_decoder.py" = ["PLR2004", "FBT001", "FBT002", "ARG002", "D401"]
"thalos_prime/lob_babel_generator.py" = ["PLC0415", "SLF001", "D205", "D401"]
"thalos_prime/lob_babel_enumerator.py" = ["PLR2004", "PLW2901", "D205", "D401"]
# Infra-synthesis modules: T201 (print in CLI), S324 (sha256 is intentional), E501 (long lines ok)
"thalos_prime/infra_synthesis/**/*.py" = [
    "T201", "S324", "E501", "PLR2004", "PLC0415",
    "TRY003", "EM101", "EM102",
    "N818",
    "FBT001", "FBT002",
    "PTH123",
    "ARG002",
]
"thalos_prime/infra_synthesis/cli/main.py" = [
    "T201", "S324", "E501", "PLR2004", "PLC0415",
    "TRY003", "EM101", "EM102",
    "TRY401",
]
# Babel subsystem: runtime imports used in annotations across all layers
"thalos_prime/babel/**/*.py" = ["TC001", "TC003"]
# Indexing: TRY003 (ValueError in __init__ and _prp_transform use built-in exception types by design)
"thalos_prime/indexing/**/*.py" = ["TRY003"]
# Belief: TRY003 (KeyError/ValueError with messages use built-in exception types by design)
"thalos_prime/belief/**/*.py" = ["TRY003"]
# Validation pipeline: TRY003/EM101/EM102 (ValueError/OverflowError with messages by design)
# ARG002: artifact reserved param in _stage_admission for future use
"thalos_prime/validation/**/*.py" = ["TRY003", "EM101", "EM102", "ARG002"]
# Audit trail: TRY003/EM101/EM102 (ValueError/TypeError with messages by design)
# PLR0913: append() intentionally takes 6 parameters to mirror the operate() lifecycle alias
"thalos_prime/audit/**/*.py" = ["TRY003", "EM101", "EM102", "PLR0913"]
# Edge executor: TRY003/EM101/EM102 (ValueError/OverflowError with messages by design)
# BLE001: catching ValueError in execute_queued to capture failures as results
"thalos_prime/edge/**/*.py" = ["TRY003", "EM101", "EM102", "BLE001"]
# formatter: boolean positional arg is part of the public interface contract
"thalos_prime/babel/interface/formatter.py" = ["FBT001", "FBT002"]
# semantic_cli: print is intentional CLI output; return count is by design
"thalos_prime/babel/interface/semantic_cli.py" = ["T201", "PLR0911"]
# __main__: T201 (print for startup banner), PLC0415 (lazy imports to avoid heavy startup cost),
# BLE001 (broad except in _execute_worker_safely re-raised immediately as BackgroundTaskError),
# UP012 (utf-8 encode explicit for clarity), UP032/UP012 (minor style),
# TRY003/EM102 (BackgroundTaskError message includes dynamic task name/step context)
"thalos_prime/__main__.py" = ["T201", "PLC0415", "BLE001", "UP012", "UP032", "TRY003", "EM102"]
# errors.py: PLR0913 (CoherenceThresholdError.__init__ needs all error context fields)
"thalos_prime/errors.py" = ["PLR0913"]
# generative_engine.py: ARG002 (seed kept for API symmetry), PLR2004 (magic 60/80 are readable constants)
# UP012 (utf-8 encode explicit), D401 (convenience function docstrings match style)
"thalos_prime/generative_engine.py" = ["ARG002", "PLR2004", "UP012", "D401"]
# thalos_runtime core modules: ANN401 (Any is required for plugin dispatch),
# PLC0415 (lazy imports to avoid circular dependencies at module load),
# TRY003/EM101/EM102/TRY301/TRY400/TC001/TC003 (typed exceptions by design)
"thalos_runtime/**/*.py" = [
    "ANN401", "PLC0415",
    "TRY003", "EM101", "EM102", "TRY301", "TRY400",
    "TC001", "TC003",
]
# thalos_runtime plugins: D102/D107 (method/nested docstrings follow internal convention),
# S101 (assert used in task validate() lifecycle methods by design),
# E501 (long lines in structured log messages are acceptable), PLR0913 (>5 params in common helpers)
"thalos_runtime/plugins/**/*.py" = ["D102", "D107", "S101", "E501", "PLR0913"]
"thalos_prime/knowledge_engine/api/**/*.py" = [
    "PLC0415", "PLR2004", "PLR0913", "BLE001", "B904", "G004", "E501",
    "ARG001", "ARG002", "TRY003", "EM101", "TRY401", "TRY300",
    "TRY301", "S104", "RUF012", "D102",
    "FBT001", "FBT002", "FAST001", "A001", "S101", "SLF001",
    "D106", "D205",
]
"thalos_prime/knowledge_engine/**/*.py" = [
    "TRY003", "EM101", "EM102", "E501", "PLR2004",
    "S324", "TC001", "TC002", "TC003", "UP042", "PLC0415", "F401",
]
"thalos_prime/knowledge_engine/workers/**/*.py" = [
    "TRY003", "EM101", "EM102", "BLE001", "S324", "E501", "PLR2004",
]
"thalos_prime/knowledge_engine/db/**/*.py" = [
    "RUF012", "BLE001", "B904", "PLC0415", "PLR2004", "E501",
    "G004", "ARG001", "TRY401", "PLW0603", "PLW0602", "D104",
    "TRY003", "EM101", "EM102", "A001",
]

[[tool.mypy.overrides]]
module = [
    "alembic",
    "alembic.*",
    "asyncpg",
    "asyncpg.*",
    "pgvector",
    "pgvector.*",
    "apscheduler",
    "apscheduler.*",
]
ignore_missing_imports = true
