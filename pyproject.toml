[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thalos-prime-library"
version = "0.1.0"
description = "The brain - ThalosPrime Library with local library import support"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ThalosPrime"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "sympy>=1.12",
    "z3-solver>=4.12.0",
    "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thalos_prime*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
thalos_prime = ["*.txt", "*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUntypedFunctionDecorator = false
reportUnknownArgumentType = false
reportPrivateUsage = false
reportUnknownParameterType = false
reportUntypedBaseClass = false
reportUnusedFunction = false
reportUnknownLambdaType = false
reportMissingImports = false
reportAssignmentType = false
reportArgumentType = false
reportOptionalSubscript = false
reportOperatorIssue = false
reportMissingTypeArgument = false
reportDeprecated = false
reportPossiblyUnboundVariable = false
reportUnusedImport = false
reportMissingModuleSource = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "ANN101", "ANN102", "D203", "D213",
    # Docstring style
    "D400", "D401", "D415", "D102", "D104", "D106", "D205",
    # Import location (needed for lazy/conditional imports)
    "PLC0415", "E402",
    # Private member access (tests need to test internals)
    "SLF001",
    # Magic values
    "PLR2004",
    # Exception handling style
    "BLE001", "B904",
    # Logging f-strings
    "G004",
    # Unused arguments required by interface/protocol
    "ARG001", "ARG002",
    # Try/except style
    "TRY300", "TRY301", "TRY401",
    # Security false positives
    "S104", "S101",
    # Pathlib migration
    "PTH110", "PTH118", "PTH120", "PTH123",
    # Global statements
    "PLW0603", "PLW0602", "PLW2901",
    # Boolean positional arguments
    "FBT001", "FBT002",
    # Style suggestions
    "FURB116", "RET504",
    # Async file operations
    "ASYNC240", "ASYNC230",
    # Print statements
    "T20",
    # Shadowing builtin
    "A001",
    # Mutable class attributes (pydantic model_config)
    "RUF012",
    # Missing return type annotations
    "ANN204",
    # Line too long
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=thalos_prime --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]  # Skip assert_used test

[[tool.mypy.overrides]]
module = [
    "sympy",
    "sympy.*",
    "networkx",
    "networkx.*",
    "z3",
    "rdflib",
    "rdflib.*",
    "bs4",
    "bs4.*",
    "requests",
    "requests.*",
    "aiohttp",
    "aiohttp.*",
    "libcst",
    "libcst.*",
]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "PLR2004", "D100", "D101", "D102", "D103", "D104",
    "ANN201", "ANN001", "ANN002", "ANN003",
    "SLF001", "PLC0415", "E402", "E501",
]
"thalos_prime/**/*.py" = [
    "D400", "D401", "D415", "D102", "D104", "D106", "D205",
    "PLC0415", "E402", "SLF001", "PLR2004",
    "BLE001", "B904", "G004", "ARG001", "ARG002",
    "TRY300", "TRY301", "TRY401",
    "S104", "S101",
    "PTH110", "PTH118", "PTH120", "PTH123",
    "PLW0603", "PLW0602", "PLW2901",
    "FBT001", "FBT002", "FURB116", "RET504",
    "ASYNC240", "ASYNC230", "T20",
    "A001", "RUF012", "ANN204", "E501",
]
"thalos_prime/__init__.py" = ["E402", "F401"]

[[tool.mypy.overrides]]
module = [
    "tests",
    "tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src",
    "src.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "thalos_prime.api",
    "thalos_prime.api.*",
    "thalos_prime.database",
    "thalos_prime.database.*",
    "thalos_prime.models.api_models",
    "thalos_prime.models.db_models",
    "thalos_prime.library_of_sense",
    "thalos_prime.library_of_sense.*",
    "thalos_prime.synthesis",
]
ignore_errors = true
