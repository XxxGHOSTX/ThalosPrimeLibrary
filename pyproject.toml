[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thalos-prime-library"
version = "0.1.0"
description = "The brain - ThalosPrime Library with local library import support"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ThalosPrime"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "sympy>=1.12",
    "z3-solver>=4.12.0",
    "requests>=2.31.0",
    "networkx>=3.2",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thalos_prime*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
thalos_prime = ["*.txt", "*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "uvicorn",
    "uvicorn.*",
    "psutil",
    "psutil.*",
]
ignore_missing_imports = true

# Suppress type errors in optional API/database modules that depend on untyped libraries
[[tool.mypy.overrides]]
module = [
    "thalos_prime.api.*",
    "thalos_prime.models.*",
    "thalos_prime.database.*",
    "thalos_prime.auth.*",
]
ignore_errors = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "ANN101", "ANN102", "D203", "D213",
    # Docstring style: period/mood requirements
    "D400", "D415", "D401",
    # Common valid patterns
    "G004",    # logging f-string
    "EM101",   # raw string in exception
    "TRY003",  # long exception message
    "S104",    # hardcoded bind all interfaces
    "FAST001", # FastAPI redundant response_model
    "B905",    # zip without explicit strict
    "FBT001",  # boolean type hint positional argument
    "FBT002",  # boolean default value positional argument
    "PLC0415", # import not at top-level (conditional imports)
    "D106",    # missing docstring in public nested class
    "D200",    # unnecessary multiline docstring
    "D205",    # missing blank line after summary
    "PLR2004", # magic value comparison (common in business logic)
    "D102",    # undocumented public method (covered by D100/D101)
    "D104",    # undocumented public package
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=thalos_prime --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]  # Skip assert_used test

# Suppress errors in tests that call untyped src/ functions
[[tool.mypy.overrides]]
module = [
    "tests.test_lob_shard_manager",
    "tests.test_lob_babel_search",
    "tests.test_api_search",
    "tests.test_api_chat",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sympy",
    "sympy.*",
    "networkx",
    "networkx.*",
    "z3",
    "rdflib",
    "rdflib.*",
    "bs4",
    "bs4.*",
    "requests",
    "requests.*",
    "aiohttp",
    "aiohttp.*",
    "libcst",
    "libcst.*",
]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "PLR2004", "D100", "D101", "D102", "D103", "D104",
    "ANN201", "ANN001", "ANN002", "ANN003",
    "PT009",   # unittest-style assertions in TestCase classes
    "SLF001",  # private member access in tests
    "ARG001",  # unused function argument in test setup
    "ARG002",  # unused method argument in test setup
    "D200", "D400", "D415", "D401", "D205",  # docstring style
    "PLC0415",  # import not at top-level (conditional imports in tests)
    "E501",     # line too long in tests
    "B905",     # zip without explicit strict in tests
]
"thalos_prime/**/*.py" = [
    "D400", "D415", "D401", "D200", "D205", "D104",  # docstring style
    "PLR2004",   # magic value comparison
    "PLC0415",   # import not at top-level (conditional imports)
    "FBT001", "FBT002",  # boolean positional args in core module signatures
]
"thalos_prime/__init__.py" = ["E402"]  # imports after sys.path manipulation are intentional
"thalos_prime/api/**/*.py" = ["BLE001", "B904", "TRY300", "TRY301", "A001", "ARG001", "ARG002", "SLF001", "TRY401", "S101", "PTH110", "PTH118", "PTH120", "PTH123", "ASYNC230", "ASYNC240", "PLW0603", "PLW0602", "E501", "FURB116", "PLW2901", "RUF012", "FAST001", "FBT001", "FBT002", "G004", "S104", "D106"]
"thalos_prime/database/**/*.py" = ["BLE001", "B904", "ARG001", "TRY401", "PLW0603", "PLW0602", "E501", "ARG002", "G004", "TRY003", "EM101"]
"thalos_prime/models/**/*.py" = ["RUF012", "E501", "N805", "D106", "D102", "TRY003", "EM101"]
