[package]
name = "thalos-governed-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Minimal ONNX Runtime inference harness with SHA3-256 provenance and repeatability checks"
license = "MIT"

[dependencies]
anyhow = "1.0"
hex = "0.4.3"
ort = "=2.0.0-rc.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.12.0"

[[bin]]
name = "thalos-governed-runtime"
path = "src/main.rs"
