name: Docker Build and Healthcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Build and start container via docker compose
        run: docker compose up -d --build

      - name: Wait for container to become healthy
        run: |
          for i in $(seq 1 40); do
            STATUS=$(docker compose ps --format json | python3 -c "
          import sys, json
          for line in sys.stdin:
              obj = json.loads(line)
              print(obj.get('Health', obj.get('State', '')))
          " 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy after ${i} checks."
              exit 0
            fi
            echo "Check ${i}/40: status=${STATUS}, waiting..."
            sleep 3
          done
          echo "Container did not become healthy in time."
          docker compose logs
          exit 1

      - name: Verify /health endpoint returns healthy JSON
        run: |
          RESPONSE=$(curl -sf http://127.0.0.1:8000/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data.get('status') == 'healthy', f'Expected healthy, got: {data}'
          print('Health check passed.')
          "

      - name: Shutdown containers
        if: always()
        run: docker compose down
